# פריסה חינמית ל-Render (Blueprint). לא נבדק מול Render בפועל - יש לאמת מול התיעוד העדכני שלהם.
# בתוכנית החינמית אין דיסק קבוע. לנתונים קבועים: מסד Postgres (DATABASE_URL, ראו README) - אז STRAUSS_DB_PATH לא בשימוש.
# בלי DATABASE_URL המסד הוא קובץ ב-/tmp שנמחק כשהשירות נרדם או מופעל מחדש.
# לשירות עם נתונים קבועים: plan: starter + בלוק disk (ראו README, סעיף "פריסה לענן").
# המפתחות והסיסמה מוגדרים בלוח הבקרה (sync: false), לא בקובץ.
services:
  - type: web
    name: strauss-car-advisor
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: STRAUSS_DB_PATH
        value: /tmp/advisor.db
      - key: DATABASE_URL
        sync: false          # כתובת Postgres (Internal Database URL מ-Render). סוד: רק בלוח הבקרה
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY_2
        sync: false
      - key: AUTH_USERS
        sync: false          # משתמשים: שם:סיסמה:תפקיד:שם תצוגה (מופרדים ב-;) - ראו README
